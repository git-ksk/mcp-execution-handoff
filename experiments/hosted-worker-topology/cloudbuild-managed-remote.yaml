steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - experiments/hosted-worker-topology/Dockerfile.managed-split
      - -t
      - ${_CONTROL_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - experiments/hosted-worker-topology/Dockerfile.remote-stateful-worker
      - -t
      - ${_WORKER_IMAGE}
      - .
images:
  - ${_CONTROL_IMAGE}
  - ${_WORKER_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
