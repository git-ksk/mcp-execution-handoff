name: Bug report
description: Report a reproducible defect without including secrets or sensitive browser data.
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes: { label: Summary }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: "Use deterministic/local reproduction. Do not include credentials, tokens, CAPTCHA/OTP/MFA values, payment data, or private endpoints." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
