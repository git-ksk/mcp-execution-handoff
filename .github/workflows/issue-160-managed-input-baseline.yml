name: Issue 160 managed input baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  managed-input-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build managed Cloud Run-equivalent image
        run: docker build -f experiments/websocket-cloud-run/Dockerfile.managed -t handoff-managed-acceptance:baseline .
      - name: Run three bounded managed WSS baselines
        env:
          HANDOFF_ACCEPTANCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "::group::managed-baseline-${run}"
            HANDOFF_BASELINE_RUN="$run" node experiments/websocket-cloud-run/managed-container-latency.mjs
            echo "::endgroup::"
          done
