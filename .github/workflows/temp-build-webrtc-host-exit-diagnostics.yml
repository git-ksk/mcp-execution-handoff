name: temp-build-webrtc-host-exit-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/webrtc-host-exit-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist already current"
            exit 0
          fi
          git commit -m "build: refresh WebRTC diagnostics dist"
          git push origin HEAD:fix/webrtc-host-exit-diagnostics
