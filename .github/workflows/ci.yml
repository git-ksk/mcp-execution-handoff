name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build
      - name: Verify committed dist is current
        if: matrix.node == 24
        run: node -e "const {execFileSync}=require('node:child_process'); const s=execFileSync('git',['status','--porcelain','--','dist'],{encoding:'utf8'}); if(s){process.stderr.write(s); process.exit(1)}"

  macos-portability:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Verify committed dist is current
        run: node -e "const {execFileSync}=require('node:child_process'); const s=execFileSync('git',['status','--porcelain','--','dist'],{encoding:'utf8'}); if(s){process.stderr.write(s); process.exit(1)}"

  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep generated artifacts byte-stable
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Verify committed dist is current
        run: node -e "const {execFileSync}=require('node:child_process'); const s=execFileSync('git',['status','--porcelain','--','dist'],{encoding:'utf8'}); if(s){process.stderr.write(s); process.exit(1)}"

  linux-normal-browser-webrtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Linux normal-browser takeover dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libx11-dev libxtst-dev xvfb xdotool x11-utils openbox ffmpeg
      - name: Build Linux XTEST pointer helper
        run: npm run build:linux-xtest-helper
      - name: Verify runner browser and X11 input helper
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser
          google-chrome-stable --version || true
          xdotool --version
          dist/native/mcp-handoff-linux-xtest-helper --version
          sha256sum dist/native/mcp-handoff-linux-xtest-helper
      - name: Run Linux acceptance on runner-image Chrome
        id: runner_chrome
        continue-on-error: true
        run: npm run accept:webrtc:linux
      - name: Upgrade runner Chrome stable
        if: always()
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get install -y --only-upgrade google-chrome-stable
            google-chrome-stable --version
          fi
      - name: Run Linux acceptance on upgraded Chrome stable
        id: stable_chrome
        if: always()
        continue-on-error: true
        run: npm run accept:webrtc:linux
      - name: Require both Linux browser acceptance paths
        if: always()
        run: |
          test "${{ steps.runner_chrome.outcome }}" = success
          test "${{ steps.stable_chrome.outcome }}" = success
