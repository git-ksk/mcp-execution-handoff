name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    name: classify-changes
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify Markdown-only change
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 "$head" | tail -n 1)"
            fi
          fi

          runtime=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              *.md) ;;
              *) runtime=true; break ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          if [ "$runtime" = "true" ]; then
            echo "Runtime-affecting or non-Markdown changes detected; run full CI."
          else
            echo "Markdown-only change detected; skip runtime/platform acceptance."
          fi

  check:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # These matrix job names are required by the main-branch ruleset. Keep
      # them present for Markdown-only PRs, but avoid npm/platform work.
      - name: Markdown-only required-check fast path
        if: needs.changes.outputs.runtime != 'true'
        run: echo "Markdown-only change; runtime CI is not required."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.runtime == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.runtime == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
        if: needs.changes.outputs.runtime == 'true'
      # Dependency vulnerability state is lockfile-scoped, not Node-matrix-scoped.
      # Audit once on Node 24; dependency-review remains a separate required PR gate.
      - run: npm audit --audit-level=moderate
        if: needs.changes.outputs.runtime == 'true' && matrix.node == 24
      - run: npm run check
        if: needs.changes.outputs.runtime == 'true'
      - run: npm run build
        if: needs.changes.outputs.runtime == 'true'
      - name: Upload generated dist for synchronization
        if: needs.changes.outputs.runtime == 'true' && matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-node24
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify committed dist is current
        if: needs.changes.outputs.runtime == 'true' && matrix.node == 24
        run: node -e "const {execFileSync}=require('node:child_process'); const s=execFileSync('git',['status','--porcelain','--','dist'],{encoding:'utf8'}); if(s){process.stderr.write(s); process.exit(1)}"
      - name: Verify clean consumer dist contract
        if: needs.changes.outputs.runtime == 'true' && matrix.node == 24
        run: npm run verify:consumer-dist
  macos-portability:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm run build
      - name: Verify committed dist is current
        run: node -e "const {execFileSync}=require('node:child_process'); const s=execFileSync('git',['status','--porcelain','--','dist'],{encoding:'utf8'}); if(s){process.stderr.write(s); process.exit(1)}"

  windows-portability:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep generated artifacts byte-stable
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm run build
      - name: Verify committed dist is current
        run: node -e "const {execFileSync}=require('node:child_process'); const s=execFileSync('git',['status','--porcelain','--','dist'],{encoding:'utf8'}); if(s){process.stderr.write(s); process.exit(1)}"

  linux-normal-browser-webrtc:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - name: Install Linux normal-browser takeover dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libx11-dev libxtst-dev libxres-dev libatspi2.0-dev at-spi2-core dbus-x11 xvfb xdotool x11-utils openbox ffmpeg
      - name: Build Linux XTEST pointer helper
        run: npm run build:linux-xtest-helper
      - name: Build Linux exact-window authority helper
        run: npm run build:linux-window-authority-helper
      - name: Build Linux AT-SPI editable helper
        run: npm run build:linux-atspi-helper
      - name: Build Linux XRecord delivery helper
        run: npm run build:linux-xrecord-delivery-helper
      - name: Build Linux X11 pointer query probe
        run: npm run build:linux-x11-pointer-query
      - name: Build Linux XRecord self-test target
        run: cc -O2 -std=c11 -Wall -Wextra -Werror native/linux-xrecord-selftest-target.c -o /tmp/mcp-handoff-linux-xrecord-selftest-target -lX11
      - name: Verify strict XRecord delivery against one-client X11 target
        run: node --import tsx experiments/linux-webrtc-host/scripts/xrecord-delivery-selftest.mts
      - name: Normalize runner Chrome stable
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get install -y --only-upgrade google-chrome-stable
            google-chrome-stable --version
          fi
      - name: Verify runner browser and X11 input helper
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser
          google-chrome-stable --version || true
          xdotool --version
          dist/native/mcp-handoff-linux-xtest-helper --version
          dist/native/mcp-handoff-linux-window-authority-helper --version
          dist/native/mcp-handoff-linux-atspi-helper --version
          dist/native/mcp-handoff-linux-xrecord-delivery-helper --version
          dist/native/mcp-handoff-linux-x11-pointer-query --version
          sha256sum dist/native/mcp-handoff-linux-xtest-helper dist/native/mcp-handoff-linux-window-authority-helper dist/native/mcp-handoff-linux-atspi-helper dist/native/mcp-handoff-linux-xrecord-delivery-helper dist/native/mcp-handoff-linux-x11-pointer-query
      # Informational control only: custom Openbox no-grab behavior differs across runner images
      # and is not the production route. Keep it visible without letting it override repeated
      # acceptance of the normal reparenting/grab path.
      - name: Observe cold Linux Chrome acceptance without Openbox Client grab
        id: no_client_grab
        continue-on-error: true
        env:
          HANDOFF_ACCEPT_OPENBOX_NO_CLIENT_GRAB: "1"
        run: dbus-run-session -- npm run accept:webrtc:linux
      - name: Run Linux Chrome stable acceptance 1
        id: stable_chrome_1
        if: always()
        continue-on-error: true
        run: dbus-run-session -- npm run accept:webrtc:linux
      - name: Run Linux Chrome stable acceptance 2
        id: stable_chrome_2
        if: always()
        continue-on-error: true
        run: dbus-run-session -- npm run accept:webrtc:linux
      - name: Require repeated Linux Chrome stable acceptance
        if: always()
        run: |
          test "${{ steps.stable_chrome_1.outcome }}" = success
          test "${{ steps.stable_chrome_2.outcome }}" = success

  websocket-cloud-run-container:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Build Cloud Run-equivalent WSS acceptance image
        run: docker build -f experiments/websocket-cloud-run/Dockerfile -t handoff-wss-acceptance:local .
      - name: Run bounded WSS container acceptance
        id: wss_acceptance
        continue-on-error: true
        run: npm run accept:websocket:cloud-run-container
      - name: Report bounded WSS failure stage
        if: always() && steps.wss_acceptance.outcome != 'success'
        run: echo "::notice::WSS acceptance stage=$(cat /tmp/handoff-wss-stage 2>/dev/null || echo unavailable)"
      - name: Require WSS container acceptance
        if: always()
        run: test "${{ steps.wss_acceptance.outcome }}" = success
      - name: Build managed Cloud Run physical acceptance image
        run: docker build -f experiments/websocket-cloud-run/Dockerfile.managed -t handoff-managed-acceptance:local .
      - name: Verify committed consumer-ready dist before public WSS gate
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: Build committed-dist public WSS acceptance image
        run: docker build -f experiments/websocket-cloud-run/Dockerfile.public-wss -t handoff-managed-public-wss-acceptance:local .
      - name: Run public Linux/Cloud Run WSS-only lifecycle gate
        id: managed_public_wss
        continue-on-error: true
        run: HANDOFF_ACCEPTANCE_REVISION=${{ github.sha }} npm run accept:websocket:managed-public-wss
      - name: Report public WSS failure stage
        if: always() && steps.managed_public_wss.outcome != 'success'
        run: echo "::notice::Managed public WSS acceptance stage=$(cat /tmp/handoff-managed-public-wss-stage 2>/dev/null || echo unavailable)"
      - name: Require public Linux/Cloud Run WSS-only lifecycle gate
        if: always()
        run: test "${{ steps.managed_public_wss.outcome }}" = success
      - name: Smoke managed exact-window target
        run: |
          docker run --rm -d --name handoff-managed-smoke \
            -p 127.0.0.1:18081:8080 \
            -e HANDOFF_WSS_PUBLIC_BASE_URL=https://placeholder.invalid \
            -e HANDOFF_ACCEPTANCE_REVISION=0000000000000000000000000000000000000000 \
            handoff-managed-acceptance:local
          trap 'docker stop handoff-managed-smoke >/dev/null 2>&1 || true' EXIT
          headers="$(mktemp)"
          body_file="$(mktemp)"
          started=0
          for _ in $(seq 1 40); do
            : > "$headers"
            : > "$body_file"
            if curl --silent --max-time 12 --dump-header "$headers" --output "$body_file" \
              http://127.0.0.1:18081/start; then
              started=1
              break
            fi
            sleep 0.25
          done
          if [ "$started" != 1 ]; then
            docker logs handoff-managed-smoke || true
            exit 1
          fi
          grep -q '^HTTP/1.1 200' "$headers"
          grep -q '^set-cookie: __Host-handoff-accept=' "$headers"
          grep -q '/start/continue' "$body_file"
          ! grep -Eq '/takeover/[A-Za-z0-9-]{8,100}' "$body_file"
          ready=0
          for _ in $(seq 1 60); do
            body="$(curl --fail --silent http://127.0.0.1:18081/ready 2>/dev/null || true)"
            if node -e 'try{const x=JSON.parse(process.argv[1]);process.exit(x.ok===true&&x.targetReady===true?0:1)}catch{process.exit(1)}' "$body"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs handoff-managed-smoke || true
            exit 1
          fi
