name: Sync issue 160 product scroll delay

on:
  push:
    branches:
      - perf/160-managed-input-baseline-run

permissions:
  contents: write

jobs:
  sync-product-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/160-managed-input-baseline-run
          fetch-depth: 0
      - name: Apply actual product scroll invocation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/browser-takeover/linux-webrtc-host-cli.ts")
          source = path.read_text()
          old = '    await runCommand(this.xdotool, ["click", "--window", String(this.geometry.windowId), "--repeat", String(repeats), String(button)], this.display);'
          new = '''    await runCommand(this.xdotool, [
                "click",
                "--delay",
                "10",
                "--window",
                String(this.geometry.windowId),
                "--repeat",
                String(repeats),
                String(button)
              ], this.display);'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one unoptimized scroll invocation")
          path.write_text(source.replace(old, new))
          PY
      - name: Commit temporary benchmark sync
        run: |
          rm .github/workflows/issue-160-sync-product-scroll-delay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser-takeover/linux-webrtc-host-cli.ts .github/workflows/issue-160-sync-product-scroll-delay.yml
          git commit -m "test(wss): benchmark actual bounded scroll delay"
          git push origin HEAD:perf/160-managed-input-baseline-run
