name: Apply issue 160 scroll latency patch

on:
  push:
    branches:
      - perf/160-bound-scroll-repeat-delay

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/160-bound-scroll-repeat-delay
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded wheel repeat delay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/browser-takeover/linux-webrtc-host-cli.ts")
          source = source_path.read_text()
          old = '    await runCommand(this.xdotool, ["click", "--window", String(this.geometry.windowId), "--repeat", String(repeats), String(button)], this.display);'
          new = '''    await runCommand(this.xdotool, [
                "click",
                "--delay",
                "10",
                "--window",
                String(this.geometry.windowId),
                "--repeat",
                String(repeats),
                String(button)
              ], this.display);'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one scroll xdotool invocation")
          source_path.write_text(source.replace(old, new))

          test_path = Path("tests/linux-webrtc-host.test.ts")
          test = test_path.read_text()
          needle = '  assert.doesNotMatch(host, /POINTER_INPUT_SETTLE_MS/);\n'
          addition = (
              '  assert.match(host, /private async scrollAxis[\\s\\S]*"--delay",[\\s\\S]*"10"[\\s\\S]*"--window"[\\s\\S]*"--repeat"/);\n'
          )
          if test.count(needle) != 1:
              raise SystemExit("expected exactly one scroll test insertion point")
          test_path.write_text(test.replace(needle, needle + addition))
          PY
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Commit verified product change
        run: |
          rm .github/workflows/issue-160-apply-scroll-delay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser-takeover/linux-webrtc-host-cli.ts tests/linux-webrtc-host.test.ts .github/workflows/issue-160-apply-scroll-delay.yml
          git commit -m "perf(linux): bound repeated wheel click delay"
          git push origin HEAD:perf/160-bound-scroll-repeat-delay
