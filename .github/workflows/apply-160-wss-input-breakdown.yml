name: apply-160-wss-input-breakdown

on:
  push:
    branches:
      - perf/160-wss-input-breakdown
    paths:
      - scripts/apply-160-wss-input-breakdown.mjs
      - scripts/fix-160-wss-input-breakdown-fixture.mjs
      - .github/workflows/apply-160-wss-input-breakdown.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/160-wss-input-breakdown
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply input latency breakdown
        run: |
          node scripts/apply-160-wss-input-breakdown.mjs
          node scripts/fix-160-wss-input-breakdown-fixture.mjs
      - name: Build committed dist
        run: npm run build
      - name: Validate source and dist closure
        run: npm run check
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit validated source and dist
        run: |
          rm scripts/apply-160-wss-input-breakdown.mjs scripts/fix-160-wss-input-breakdown-fixture.mjs .github/workflows/apply-160-wss-input-breakdown.yml
          git config user.name git-ksk
          git config user.email 108925270+git-ksk@users.noreply.github.com
          git add -A
          git commit -m "perf(wss): decompose managed input latency"
          git push origin HEAD:perf/160-wss-input-breakdown
