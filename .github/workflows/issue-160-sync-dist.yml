name: Sync issue 160 generated dist

on:
  push:
    branches:
      - perf/160-bound-scroll-repeat-delay

permissions:
  contents: write

jobs:
  sync-dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/160-bound-scroll-repeat-delay
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify and commit generated closure
        run: |
          git status --short -- dist
          test -n "$(git status --porcelain -- dist)"
          rm .github/workflows/issue-160-sync-dist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist .github/workflows/issue-160-sync-dist.yml
          git commit -m "build: sync bounded scroll delay dist"
          git push origin HEAD:perf/160-bound-scroll-repeat-delay
