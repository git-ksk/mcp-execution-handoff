name: Apply 177 completion lifecycle fix

on:
  push:
    branches:
      - fix/177-completion-lifecycle-races

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/177-completion-lifecycle-races
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/apply-177-completion-fix.mjs
      - run: npm run check
      - run: npm run build
      - run: git diff --check
      - name: Commit validated source and generated dist
        shell: bash
        run: |
          git rm .github/workflows/apply-177-completion-fix.yml scripts/apply-177-completion-fix.mjs
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(browser-handoff): serialize completion cleanup"
          git push origin HEAD:fix/177-completion-lifecycle-races
