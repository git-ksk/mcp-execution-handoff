name: Sync Native-only Dist

on:
  pull_request:
    paths:
      - .github/workflows/apply-native-only-session.yml

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'experiment/thin-takeover-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit generated dist
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "build: sync Native-only broker dist"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
